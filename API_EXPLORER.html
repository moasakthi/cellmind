<title>CellMind API Reference</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#F3F5F6; --paper-raised:#FFFFFF;
    --ink:#0A0E13; --ink-soft:#3C4650; --ink-mute:#6B7680;
    --line:#D6DCE1; --line-soft:#E6EAED;
    --accent:#0E8F85; --accent-soft:#DEF4F1; --accent-ink:#07443F;
    --furnace:#B75E17; --furnace-soft:#FBE7D3; --furnace-ink:#5C2E0B;
    --danger:#B23327; --danger-soft:#FBE1DD; --danger-ink:#5C1B14;
    --good:#2A7A50; --good-soft:#E1F1E7; --good-ink:#153F29;
    --radius-sm:3px; --radius-md:6px;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A0E13; --paper-raised:#121920;
      --ink:#EDF1F3; --ink-soft:#B7C0C7; --ink-mute:#7C8790;
      --line:#232B33; --line-soft:#1B222A;
      --accent:#49D9CB; --accent-soft:#102E2B; --accent-ink:#9CEEE4;
      --furnace:#EE9C4C; --furnace-soft:#2E2011; --furnace-ink:#F7C58C;
      --danger:#EC6B5C; --danger-soft:#301715; --danger-ink:#F5A99C;
      --good:#57C182; --good-soft:#12291B; --good-ink:#9CE0B7;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A0E13; --paper-raised:#121920;
    --ink:#EDF1F3; --ink-soft:#B7C0C7; --ink-mute:#7C8790;
    --line:#232B33; --line-soft:#1B222A;
    --accent:#49D9CB; --accent-soft:#102E2B; --accent-ink:#9CEEE4;
    --furnace:#EE9C4C; --furnace-soft:#2E2011; --furnace-ink:#F7C58C;
    --danger:#EC6B5C; --danger-soft:#301715; --danger-ink:#F5A99C;
    --good:#57C182; --good-soft:#12291B; --good-ink:#9CE0B7;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--font-mono);}

  .app{display:grid; grid-template-columns:280px 1fr; height:100vh;}
  @media (max-width:820px){ .app{grid-template-columns:1fr; height:auto;} .side{position:static; height:auto;} }

  .side{border-right:1px solid var(--line); overflow-y:auto; height:100vh; padding:16px 12px 40px; position:sticky; top:0;}
  .side .brand{display:flex; align-items:baseline; justify-content:space-between; padding:2px 6px 12px;}
  .side .brand b{font-size:14.5px;}
  .side .brand span{font:10.5px var(--font-mono); color:var(--ink-mute);}
  .search{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper-raised); color:var(--ink); font-size:13px; margin-bottom:12px;}
  .taggroup{margin-bottom:4px;}
  .tagname{font:10.5px var(--font-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-mute); padding:10px 6px 4px;}
  .ep-item{display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:var(--radius-sm); cursor:pointer;}
  .ep-item:hover{background:var(--line-soft);}
  .ep-item.active{background:var(--accent-soft);}
  .ep-item .m{font:10px var(--font-mono); font-weight:700; width:38px; flex:none; text-align:center; border-radius:3px; padding:2px 0;}
  .m-GET{background:var(--accent-soft); color:var(--accent-ink);}
  .m-POST{background:var(--good-soft); color:var(--good-ink);}
  .m-PUT{background:var(--furnace-soft); color:var(--furnace-ink);}
  .ep-item .p{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ep-item.active .p{color:var(--ink); font-weight:600;}

  main{overflow-y:auto; height:100vh; padding:30px 40px 100px;}
  @media (max-width:820px){ main{height:auto;} }
  .head{display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .head .m{font:12px var(--font-mono); font-weight:700; padding:4px 9px; border-radius:4px;}
  .head .p{font:19px var(--font-mono); font-weight:600;}
  h1.sum{font-size:20px; margin:4px 0 4px;}
  .desc{color:var(--ink-mute); margin:0 0 24px; max-width:70ch;}
  .tagchip{font:10.5px var(--font-mono); text-transform:uppercase; letter-spacing:.04em; color:var(--ink-mute); background:var(--line-soft); border-radius:100px; padding:3px 9px;}

  h2.h{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-mute); margin:26px 0 10px; border-top:1px solid var(--line-soft); padding-top:18px;}
  h2.h:first-of-type{border-top:none; padding-top:0;}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-md);}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:480px;}
  th{text-align:left; font:10.5px var(--font-mono); text-transform:uppercase; color:var(--ink-mute); padding:8px 12px; border-bottom:1px solid var(--line); background:var(--line-soft); white-space:nowrap;}
  td{padding:8px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .req{color:var(--danger-ink); font-size:10.5px; font-family:var(--font-mono);}

  .status{font:11px var(--font-mono); font-weight:700; padding:2px 7px; border-radius:100px;}
  .st-2{background:var(--good-soft); color:var(--good-ink);}
  .st-4{background:var(--danger-soft); color:var(--danger-ink);}

  .resp-row{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft); align-items:flex-start;}
  .resp-row:last-child{border-bottom:none;}
  .resp-row .desc-cell{font-size:12.5px; color:var(--ink-soft); flex:1;}
  .schema-link{font:12px var(--font-mono); color:var(--accent); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0;}

  .card{border:1px solid var(--line); border-radius:var(--radius-md); background:var(--paper-raised); padding:14px; margin-bottom:16px;}
  .empty{color:var(--ink-mute); font-size:13px; padding:60px 0; text-align:center;}
  .homecards{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:20px;}
  @media (max-width:640px){ .homecards{grid-template-columns:1fr;} }
  .homecards .card b{display:block; font-size:13.5px; margin-bottom:4px;}
  .homecards .card span{color:var(--ink-mute); font-size:12.5px;}
  .theme-toggle{border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); border-radius:var(--radius-md); padding:5px 10px; font:11px var(--font-mono); cursor:pointer;}
</style>

<div class="app">
  <nav class="side">
    <div class="brand"><div><b>CellMind</b><br><span>API REFERENCE · v1.0.0</span></div><button class="theme-toggle" id="themeToggle">◐</button></div>
    <input class="search" id="search" placeholder="Search endpoints…" />
    <div id="navroot"></div>
  </nav>
  <main id="main"></main>
</div>

  if(!rows) return '<p style="color:var(--ink-mute); font-size:12.5px;">'+esc(name)+'</p>';
  var html = '<div class="table-wrap"><table><thead><tr><th>Field</th><th>Type</th><th>Notes / example</th></tr></thead><tbody>';
  rows.forEach(function(r){ html += '<tr><td class="mono">'+esc(r[0])+'</td><td class="mono">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; });
  return html + '</tbody></table></div>';
}

function renderHome(){
  var tags = {};
  ENDPOINTS.forEach(function(e){ tags[e.tag] = (tags[e.tag]||0)+1; });
  var cards = Object.keys(tags).map(function(t){
    return '<div class="card"><b>'+esc(t)+'</b><span>'+tags[t]+' endpoint'+(tags[t]>1?'s':'')+'</span></div>';
  }).join('');
  document.getElementById('main').innerHTML =
    '<h1 class="sum">CellMind API Reference</h1>' +
    '<p class="desc">Full end-to-end contract for CellMind — batches, inspection, camera ingestion, agent investigations, recommendations, retraining, taxonomy, RBAC and audit. Select an endpoint on the left. The canonical machine-readable contract is <span class="mono">openapi.yaml</span>, importable into any Swagger/Postman/Insomnia tooling; this page is a hand-built, self-contained reference over the same paths.</p>' +
    '<div class="homecards">'+cards+'</div>';
}

function renderEndpoint(ep){
  var main = document.getElementById('main');
  var html = '';
  html += '<div class="head"><span class="m m-'+ep.m+'">'+ep.m+'</span><span class="p">'+esc(ep.p)+'</span><span class="tagchip">'+esc(ep.tag)+'</span>' + (ep.auth===false ? '<span class="tagchip">NO AUTH</span>' : '') + '</div>';
  html += '<h1 class="sum">'+esc(ep.sum)+'</h1>';

  if(ep.params && ep.params.length){
    html += '<h2 class="h">Parameters</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Notes</th></tr></thead><tbody>';
    ep.params.forEach(function(p){
      html += '<tr><td class="mono">'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="mono">'+esc(p[2])+'</td><td>'+esc(p[3])+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  if(ep.body){
    html += '<h2 class="h">Request Body</h2>';
    if(SCHEMAS[ep.body]) html += schemaTable(ep.body);
    else html += '<div class="card mono" style="font-size:12.5px;">'+esc(ep.body)+'</div>';
  }

  html += '<h2 class="h">Responses</h2>';
  ep.resp.forEach(function(r){
    var stClass = r[0][0]==='2' ? 'st-2' : 'st-4';
    var schemaName = r[2].replace('PaginatedResponse<','').replace('>','').replace('[]','');
    html += '<div class="resp-row"><span class="status '+stClass+'">'+r[0]+'</span><div class="desc-cell">'+esc(r[1])+'<br><button class="schema-link" data-schema="'+esc(schemaName)+'">'+esc(r[2])+'</button></div></div>';
  });
  html += '<div id="schemaDetail" style="margin-top:14px;"></div>';

  main.innerHTML = html;
  main.querySelectorAll('.schema-link').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('schemaDetail').innerHTML = '<h2 class="h">Schema — '+esc(btn.dataset.schema)+'</h2>' + schemaTable(btn.dataset.schema);
    });
  });
}

function buildNav(filter){
  var root = document.getElementById('navroot');
  root.innerHTML = '';
  var byTag = {};
  ENDPOINTS.forEach(function(e, i){
    if(filter && (e.p+' '+e.sum).toLowerCase().indexOf(filter.toLowerCase()) === -1) return;
    (byTag[e.tag] = byTag[e.tag] || []).push(i);
  });
  Object.keys(byTag).forEach(function(tag){
    var g = document.createElement('div'); g.className = 'taggroup';
    var t = document.createElement('div'); t.className = 'tagname'; t.textContent = tag; g.appendChild(t);
    byTag[tag].forEach(function(i){
      var e = ENDPOINTS[i];
      var item = document.createElement('div');
      item.className = 'ep-item'; item.dataset.idx = i;
      item.innerHTML = '<span class="m m-'+e.m+'">'+e.m+'</span><span class="p">'+esc(e.p)+'</span>';
      item.addEventListener('click', function(){
        document.querySelectorAll('.ep-item').forEach(function(x){ x.classList.remove('active'); });
        item.classList.add('active');
        renderEndpoint(e);
      });
      g.appendChild(item);
    });
    root.appendChild(g);
  });
}

buildNav('');
renderHome();

document.getElementById('search').addEventListener('input', function(e){ buildNav(e.target.value); });
document.getElementById('themeToggle').addEventListener('click', function(){
  var root = document.documentElement;
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var cur = root.getAttribute('data-theme');
  var effectiveIsDark = cur ? cur === 'dark' : prefersDark;
  root.setAttribute('data-theme', effectiveIsDark ? 'light' : 'dark');
});
</script>
